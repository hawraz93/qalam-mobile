name: qalam_notify
description: Al-Qalam University staff notifications app.
publish_to: "none"
version: 1.8.2+13

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^11.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^19.0.0
  url_launcher: ^6.3.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
  image_picker: ^1.1.2
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Vazirmatn (OFL): one face for Kurdish, Arabic and Latin text
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

# University logo as the app icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # turn on after `flutter create . --platforms ios` on a Mac; also set remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 20
